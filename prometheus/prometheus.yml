global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: llama
    scrape_timeout: 4s
    metrics_path: /llama
    static_configs:
      - targets: [exporter:9108]
        labels:
          server: local
  - job_name: llmmonitor
    scrape_timeout: 4s
    static_configs:
      - targets: [exporter:9108]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
