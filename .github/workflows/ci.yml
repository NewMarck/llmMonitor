name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check.py
      - name: Shell scripts
        if: runner.os != 'Windows'
        run: |
          sh -n scripts/bootstrap
          sh -n scripts/llm-monitor
          ./scripts/llm-monitor --help
      - name: PowerShell entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/llm-monitor.ps1 --help
  native-build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: cpu
          - os: macos-latest
            backend: metal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev
      - run: python -m llmmonitor.cli install --clone --backend ${{ matrix.backend }} --jobs 2
      - run: python -m llmmonitor.cli install --backend existing
  docker-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m llmmonitor.cli setup
      - run: docker compose -p llmmonitor-ci -f compose.yaml -f tests/compose.test.yaml config --quiet
      - run: docker compose -p llmmonitor-ci -f compose.yaml -f tests/compose.test.yaml up -d --build --wait --wait-timeout 180
      - run: python -m tests.check_stack
      - name: Logs
        if: failure()
        run: docker compose -p llmmonitor-ci -f compose.yaml -f tests/compose.test.yaml logs --tail 100
      - name: Stop isolated stack
        if: always()
        run: docker compose -p llmmonitor-ci -f compose.yaml -f tests/compose.test.yaml down --volumes
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Exporter architectures
        run: docker buildx build --platform linux/amd64,linux/arm64 --file docker/exporter.Dockerfile .
      - name: Grafana architectures
        run: docker buildx build --platform linux/amd64,linux/arm64 --file docker/grafana.Dockerfile .
